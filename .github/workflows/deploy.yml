name: Deploy infrastructure
on:
  push:
    branches:
    - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        stack: [network, security, storage, compute, cdn]

    steps:
    - name: Checkout git repository
      uses: actions/checkout@v6
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::476140239102:role/infra-deploy
        aws-region: us-east-1
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.15.0
    
    - name: Initialize Terraform
      run: terraform -chdir=stacks/${{matrix.stack}} init
  
    - name: Terraform Validate
      run: terraform -chdir=stacks/${{matrix.stack}} validate

    - name: Terraform Plan
      run: terraform -chdir=stacks/${{matrix.stack}} plan -var-file=dev.tfvars -no-color -out=tfplan

    - name: Terraform Apply
      run: terraform -chdir=stacks/${{matrix.stack}} apply -auto-approve tfplan